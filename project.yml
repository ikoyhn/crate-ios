# Generate the Xcode project with XcodeGen (brew install xcodegen):  xcodegen generate
name: CrateCompanion
options:
  bundleIdPrefix: app.crate
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

packages:
  CrateKit:
    path: CrateKit

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # Set your team here (or in Xcode > Signing & Capabilities) to run on a device
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  CrateCompanion:
    type: application
    platform: iOS
    sources:
      - path: CrateCompanion
    dependencies:
      - package: CrateKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.crate.companion
        PRODUCT_NAME: Crate
        INFOPLIST_FILE: CrateCompanion/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES

schemes:
  CrateCompanion:
    build:
      targets:
        CrateCompanion: all
    test:
      targets:
        - package: CrateKit/CrateKitTests
